env_settings:
  env_path: "../Builds/Machine learning FPS.exe"
  num_envs: 8

behaviors:
  MLPlayer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 8192
      buffer_size: 409600
      learning_rate: 3.0e-4
      beta: 2.0e-3
      beta_schedule: linear
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 6
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      memory:
        sequence_length: 128
        memory_size: 512
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    self_play:
      save_steps: 3000000
      swap_steps: 1800000
      team_change: 6000000
      window: 10
      play_against_latest_model_ratio: 0.2
    keep_checkpoints: 20
    checkpoint_interval: 5000000
    max_steps: 500000000
    time_horizon: 512
    summary_freq: 200000