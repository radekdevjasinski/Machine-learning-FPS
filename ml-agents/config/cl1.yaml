env_settings:
  env_path: "../Builds/Machine learning FPS.exe"
  num_envs: 8


behaviors:
  MLPlayer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 8192
      buffer_size: 409600
      learning_rate: 0.0001
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 6
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      memory:
        sequence_length: 128
        memory_size: 512
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.1
    self_play:
      save_steps: 30000
      team_change: 200000
      swap_steps: 15000
      window: 12
      play_against_latest_model_ratio: 0.5
    keep_checkpoints: 12
    checkpoint_interval: 1000000
    max_steps: 60000000
    time_horizon: 256
    summary_freq: 1000000